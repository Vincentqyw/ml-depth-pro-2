name: DepthPro2
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: V7Y52JS55X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  DepthPro2:
    type: application
    platform: iOS
    sources:
      - path: DepthPro2
        excludes:
          - Info.plist
      - path: Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anureka.depthpro2
        PRODUCT_NAME: DepthPro2
        INFOPLIST_FILE: DepthPro2/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  DepthPro2:
    build:
      targets:
        DepthPro2: all
    run:
      config: Debug
